<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>15 Puzzle</title>
<style>
  body {font-family:Arial;text-align:center;background:#111;color:#eee;}
  #info {margin:30px;}
  #moves {font-size:28px;font-weight:bold;color:#0f0;}
  button {padding:14px 30px;font-size:20px;background:#e91e63;color:white;border:none;border-radius:8px;cursor:pointer;margin:15px;}
  button:hover {background:#c2185b;}
  #game {display:grid;grid-template-columns:repeat(4,110px);gap:8px;justify-content:center;margin:20px auto;}
  .tile {width:110px;height:110px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.5);transition:all 0.15s;}
  .tile:hover {transform:scale(1.05);box-shadow:0 8px 25px rgba(0,0,0,0.7);}
  .empty {background:#222;border-radius:12px;}
</style>
</head>
<body>
<div id="info">
  <h1>Solve under 150 moves</h1>
  <div id="moves">Moves: 0</div>
  <button id="newgame">New Game</button>
</div>
<div id="game" tabindex="0"></div>

<script>
const game = document.getElementById('game');
const movesEl = document.getElementById('moves');
let board = Array(16);
let moves = 0;
const keyToTile = {q:1,w:2,e:3,r:4,a:5,s:6,d:7,f:8,z:9,x:10,c:11,v:12};

function init() {for(let i=0;i<16;i++) board[i]=i<15?i+1:0;}
function emptyPos() {return board.indexOf(0);}
function swap(a,b) {[board[a],board[b]]=[board[b],board[a]];}

function render() {
  for(let i=0;i<16;i++){
    const c=document.getElementById('c'+i);
    const v=board[i];
    c.textContent=v||'';
    c.className=v?'tile':'empty';
  }
}

function create() {
  for(let i=0;i<16;i++){
    const d=document.createElement('div');
    d.id='c'+i;
    game.appendChild(d);
  }
}

function shuffle() {
  init();
  for(let i=0;i<1200;i++){
    const p=emptyPos();
    const d=[-1,1,-4,4][Math.floor(Math.random()*4)];
    const n=p+d;
    if(n<0||n>15)continue;
    if(Math.abs(d)===1&&Math.floor(p/4)!==Math.floor(n/4))continue;
    swap(p,n);
  }
  moves=0;updateMoves();render();
}

function moveTile(tile){
  const pos=board.indexOf(tile);
  if(pos<0)return;
  const ep=emptyPos();
  const dr=Math.abs(Math.floor(pos/4)-Math.floor(ep/4));
  const dc=Math.abs(pos%4-ep%4);
  if(dr+dc===1){swap(pos,ep);moves++;updateMoves();render();checkWin();}
}

function moveDirection(dir){
  const ep=emptyPos();
  const tilePos=ep+dir;
  if(tilePos<0||tilePos>15)return;
  if(Math.abs(dir)===1&&Math.floor(ep/4)!==Math.floor(tilePos/4))return;
  swap(ep,tilePos);
  moves++;updateMoves();render();checkWin();
}

function checkWin(){
  for(let i=0;i<15;i++)if(board[i]!==i+1)return;
  if(board[15]!==0)return;
  alert(`Solved in ${moves} moves!`);
}

function updateMoves(){movesEl.textContent=`Moves: ${moves}`;}

game.addEventListener('keydown',e=>{
  e.preventDefault();
  const k=e.key.toLowerCase();
  if(keyToTile[k])return moveTile(keyToTile[k]);

  switch(e.key){
    case 'ArrowUp':    moveDirection(4);  break; // ↑ moves tile down
    case 'ArrowDown':  moveDirection(-4); break; // ↓ moves tile up
    case 'ArrowLeft':  moveDirection(1);  break; // ← moves tile right
    case 'ArrowRight': moveDirection(-1); break; // → moves tile left
  }
});

document.getElementById('newgame').onclick=shuffle;

create();
shuffle();
game.focus();
</script>
</body>
</html>
