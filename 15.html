<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>15 Puzzle</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f1ea; --board:#d9d3c4; --tile:#fffdf8; --tile-ok:#cfe8d0; --text:#2b2a26; --muted:#7a766a; --accent:#d2552b; --shadow:rgba(0,0,0,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --board:#2c2a26; --tile:#46433c; --tile-ok:#3a5a3d; --text:#f0ece2; --muted:#9a958a; --accent:#ff7a4d; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a18; --board:#2c2a26; --tile:#46433c; --tile-ok:#3a5a3d; --text:#f0ece2; --muted:#9a958a; --accent:#ff7a4d; --shadow:rgba(0,0,0,.5);
}
html{color-scheme:light dark;height:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px}
h1{margin:0;font-size:28px;letter-spacing:.5px}
.stats{display:flex;gap:28px;align-items:baseline}
.stat{text-align:center}
.stat b{display:block;font-size:34px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
#board{position:relative;width:min(92vw,420px);aspect-ratio:1;background:var(--board);border-radius:18px;padding:6px;box-sizing:border-box;box-shadow:inset 0 2px 6px var(--shadow)}
#inner{position:relative;width:100%;height:100%}
.tile{position:absolute;left:0;top:0;width:25%;height:25%;padding:3px;box-sizing:border-box;transition:transform .13s ease-out;cursor:pointer}
.tile div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--tile);border-radius:12px;font-size:clamp(24px,8.5vw,40px);font-weight:700;box-shadow:0 2px 0 var(--shadow);transition:background .2s}
.tile.ok div{background:var(--tile-ok)}
.tile:active div{transform:scale(.95)}
button{font:inherit;font-size:17px;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:14px;padding:14px 34px;cursor:pointer}
button:active{opacity:.8}
#msg{min-height:24px;font-size:18px;font-weight:600;color:var(--accent);text-align:center}
</style>
</head>
<body>
<h1>15 Puzzle</h1>
<div class="stats">
  <div class="stat"><b id="moves">0</b><span>Moves</span></div>
</div>
<div id="board"><div id="inner"></div></div>
<div id="msg"></div>
<button id="new">New game</button>

<script>
(function(){
  var N = 4, SIZE = N * N;
  var inner = document.getElementById('inner');
  var movesEl = document.getElementById('moves');
  var msgEl = document.getElementById('msg');
  var grid, moves, solved, tileEls = {};

  // grid[i] = tile number at cell i (row-major), 0 = empty
  function solvedGrid(){
    var g = [];
    for (var i = 0; i < SIZE - 1; i++) g.push(i + 1);
    g.push(0);
    return g;
  }

  function neighbors(idx){
    var r = Math.floor(idx / N), c = idx % N, out = [];
    if (r > 0) out.push(idx - N);
    if (r < N - 1) out.push(idx + N);
    if (c > 0) out.push(idx - 1);
    if (c < N - 1) out.push(idx + 1);
    return out;
  }

  // Shuffle with random legal moves from the solved state: always solvable.
  function shuffle(){
    var g = solvedGrid(), empty = SIZE - 1, prev = -1;
    for (var i = 0; i < 300; i++){
      var opts = neighbors(empty).filter(function(n){ return n !== prev; });
      var n = opts[Math.floor(Math.random() * opts.length)];
      g[empty] = g[n]; g[n] = 0;
      prev = empty; empty = n;
    }
    return g;
  }

  function isSolved(){
    for (var i = 0; i < SIZE - 1; i++) if (grid[i] !== i + 1) return false;
    return true;
  }

  function build(){
    inner.innerHTML = '';
    tileEls = {};
    for (var n = 1; n < SIZE; n++){
      var t = document.createElement('div');
      t.className = 'tile';
      t.innerHTML = '<div>' + n + '</div>';
      (function(num){
        t.addEventListener('pointerdown', function(e){ e.preventDefault(); tap(num); });
      })(n);
      inner.appendChild(t);
      tileEls[n] = t;
    }
  }

  function render(){
    for (var i = 0; i < SIZE; i++){
      var n = grid[i];
      if (!n) continue;
      var r = Math.floor(i / N), c = i % N;
      var el = tileEls[n];
      el.style.transform = 'translate(' + (c * 100) + '%,' + (r * 100) + '%)';
      el.classList.toggle('ok', n === i + 1);
    }
    movesEl.textContent = moves;
  }

  function tap(num){
    if (solved) return;
    var idx = grid.indexOf(num), empty = grid.indexOf(0);
    if (neighbors(idx).indexOf(empty) === -1) return;
    grid[empty] = num; grid[idx] = 0;
    moves++;
    render();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch(e){}
    if (isSolved()){
      solved = true;
      msgEl.textContent = '\u{1F389} Solved in ' + moves + ' moves!';
    }
  }

  function start(){
    do { grid = shuffle(); } while (isSolved());
    moves = 0; solved = false;
    msgEl.textContent = '';
    build();
    render();
  }

  document.getElementById('new').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
